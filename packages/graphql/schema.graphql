type Employee {
  email: String!
  name: String!
  role: EmployeeRole!
  sub: ID!
}

enum EmployeeRole {
  ADMIN
}

type Location {
  active: Boolean!
  businessDayCutoffHour: Int!
  country: String
  id: ID!
  name: String!
  timeZone: String!
}

input LocationCreateInput {
  businessDayCutoffHour: Int
  country: String
  name: String!
  timeZone: String!
}

input LocationUpdateInput {
  active: Boolean
  businessDayCutoffHour: Int
  country: String
  name: String
  timeZone: String
}

type Mutation {
  createLocation(input: LocationCreateInput!): Location!
  createWorker(input: WorkerCreateInput!): Worker!
  deactivateWorker(workerId: String!): Worker!
  punch(type: PunchType!, workerId: String!): PunchEvent!
  updateLocation(input: LocationUpdateInput!, locationId: String!): Location!
  updateWorker(input: WorkerUpdateInput!, workerId: String!): Worker!
}

type PunchEvent {
  businessDate: String!
  corrected: Boolean!
  id: ID!
  locationId: String!
  note: String
  occurredAt: String!
  timeZone: String!
  type: PunchType!
  worker: Worker
  workerId: String!
}

enum PunchType {
  CLOCK_IN
  CLOCK_OUT
}

type Query {
  health: String!
  locations: [Location!]!
  punchesByDate(businessDate: String, locationId: String!): [PunchEvent!]!
  workerStatus(workerId: String!): WorkerDayStatus!
  workers(locationId: String!): [Worker!]!
  workersByLocation(locationId: String!): [Worker!]!
}

type Worker {
  active: Boolean!
  createdAt: String!
  displayName: String!
  id: ID!
  locationId: String!
  name: String!
  nameKana: String!
}

input WorkerCreateInput {
  displayName: String!
  locationId: String!
  name: String!
  nameKana: String!
}

type WorkerDayStatus {
  lastPunchAt: String
  punchesToday: [PunchEvent!]!
  status: WorkerStatus!
  workerId: ID!
}

enum WorkerStatus {
  CLOCKED_OUT
  NOT_CLOCKED_IN
  WORKING
}

input WorkerUpdateInput {
  active: Boolean
  displayName: String
  name: String
  nameKana: String
}
