packages:
  - "apps/*"
  - "packages/*"

# 依存バージョンは catalog に集約して一元管理する（各 package.json では "catalog:" で参照）。
catalog:
  # infra / tooling
  sst: ^4.17.1
  typescript: ^7.0.2
  "@types/node": ^22.10.0

  # web
  next: ^16.3.2
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0

  # graphql
  graphql: ^17.0.2
  "@pothos/core": ^4.13.1
  graphql-yoga: ^5.22.0

  # data / auth / validation
  "@aws-sdk/client-dynamodb": ^3.1117.0
  "@aws-sdk/lib-dynamodb": ^3.1117.0
  aws-jwt-verify: ^5.2.1
  zod: ^4.4.3
  ulid: ^3.0.2

  # test
  vitest: ^4.1.11
  aws-sdk-client-mock: ^4.1.0
