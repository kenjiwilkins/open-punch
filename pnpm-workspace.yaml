packages:
  - "apps/*"
  - "packages/*"

# 依存バージョンは catalog に集約して一元管理する（各 package.json では "catalog:" で参照）。
catalog:
  # infra / tooling
  sst: ^4.17.1
  typescript: ^7.0.2
  "@types/node": ^22.10.0

  # web
  next: ^16.3.2
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0

  # ui / styling
  tailwindcss: ^4.1.0
  "@tailwindcss/postcss": ^4.1.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.0.0
  lucide-react: ^0.545.0

  # graphql
  # graphql-codegen / graphql-request など周辺ツールがまだ 17 未対応のため 16 系に固定。
  graphql: ^16.11.0
  "@pothos/core": ^4.13.1
  graphql-yoga: ^5.22.0
  graphql-request: ^7.1.0
  "@graphql-typed-document-node/core": ^3.2.0
  "@graphql-codegen/cli": ^5.0.0
  "@graphql-codegen/client-preset": ^4.5.0
  tsx: ^4.19.0
  server-only: ^0.0.1

  # data / auth / validation
  "@aws-sdk/client-dynamodb": ^3.1117.0
  "@aws-sdk/lib-dynamodb": ^3.1117.0
  aws-jwt-verify: ^5.2.1
  zod: ^4.4.3
  ulid: ^3.0.2

  # test
  vitest: ^4.1.11
  aws-sdk-client-mock: ^4.1.0
  "@testing-library/react": ^16.1.0
  "@testing-library/jest-dom": ^6.6.3
  happy-dom: ^19.0.0
  "@vitejs/plugin-react": ^5.0.0

  # storybook
  storybook: ^10.5.10
  "@storybook/nextjs-vite": ^10.5.10
