name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一 PR/ブランチで新しい push があれば古い実行はキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager フィールドから pnpm 10.x を導入
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # フロントにロジックが入るため Next build も回す。
      # 実行時に読む env はビルドを通すためのダミー（force-dynamic なので実際には未使用）。
      - name: Build
        run: pnpm build
        env:
          GRAPHQL_URL: https://example.invalid/graphql
          KIOSK_API_KEY: dummy-ci-api-key
          KIOSK_LOCATION_ID: L_CI
